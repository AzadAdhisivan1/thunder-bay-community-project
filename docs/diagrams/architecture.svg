<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Thunder Link — system architecture (end of Sprint 1)</text>
  <text x="40" y="76" font-size="15" fill="#475569">Three Docker containers started with one command: docker compose up</text>

  <!-- External: OpenStreetMap -->
  <rect x="300" y="104" width="320" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="128" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">OpenStreetMap tile servers</text>
  <text x="460" y="146" font-size="12.5" fill="#64748b" text-anchor="middle">external · map background images</text>

  <!-- Browser -->
  <rect x="40" y="330" width="200" height="110" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="140" y="372" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">User's browser</text>
  <text x="140" y="396" font-size="13" fill="#475569" text-anchor="middle">phone or desktop</text>
  <text x="140" y="416" font-size="13" fill="#475569" text-anchor="middle">localhost:5173</text>

  <!-- Frontend container -->
  <rect x="300" y="190" width="320" height="420" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="222" font-size="17" font-weight="700" fill="#1e3a8a">Frontend container</text>
  <text x="320" y="243" font-size="13" fill="#1e40af">React 18 + Vite · port 5173</text>

  <rect x="320" y="262" width="280" height="88" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="336" y="286" font-size="14.5" font-weight="600" fill="#1e3a8a">Pages (React Router)</text>
  <text x="336" y="308" font-size="13" fill="#334155">Home · Results · Service details</text>
  <text x="336" y="330" font-size="12" fill="#64748b">routes done · content in progress</text>

  <rect x="320" y="364" width="280" height="110" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="336" y="388" font-size="14.5" font-weight="600" fill="#1e3a8a">Components</text>
  <text x="336" y="410" font-size="13" fill="#334155">SearchBar · CategoryList</text>
  <text x="336" y="430" font-size="13" fill="#334155">ServiceCard</text>
  <text x="336" y="452" font-size="13" fill="#334155">ResultsMap (Leaflet) ✓</text>

  <rect x="320" y="488" width="280" height="102" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="336" y="512" font-size="14.5" font-weight="600" fill="#1e3a8a">api/client.js</text>
  <text x="336" y="534" font-size="13" fill="#334155">only place that calls the backend</text>
  <text x="336" y="556" font-size="13" fill="#334155">getCategories · getServicesByCategory</text>
  <text x="336" y="576" font-size="13" fill="#334155">searchServices · getService</text>

  <!-- Backend container -->
  <rect x="700" y="190" width="330" height="420" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="222" font-size="17" font-weight="700" fill="#14532d">Backend container</text>
  <text x="720" y="243" font-size="13" fill="#166534">Python · FastAPI REST API · port 8000</text>

  <rect x="720" y="262" width="290" height="78" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="736" y="286" font-size="14.5" font-weight="600" fill="#14532d">Routers</text>
  <text x="736" y="307" font-size="13" fill="#334155">/categories · /services · /search</text>
  <text x="736" y="327" font-size="12" fill="#64748b">validate input · 404 / 422 errors</text>

  <rect x="720" y="356" width="290" height="62" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="736" y="380" font-size="14.5" font-weight="600" fill="#14532d">CRUD queries</text>
  <text x="736" y="401" font-size="13" fill="#334155">filter · keyword search · get by id</text>

  <rect x="720" y="434" width="140" height="62" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="736" y="458" font-size="14.5" font-weight="600" fill="#14532d">Models</text>
  <text x="736" y="479" font-size="12.5" fill="#334155">SQLAlchemy</text>

  <rect x="870" y="434" width="140" height="62" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="886" y="458" font-size="14.5" font-weight="600" fill="#14532d">Schemas</text>
  <text x="886" y="479" font-size="12.5" fill="#334155">JSON shapes</text>

  <rect x="720" y="512" width="290" height="78" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="736" y="536" font-size="14.5" font-weight="600" fill="#475569">NLP / ranking (planned)</text>
  <text x="736" y="557" font-size="13" fill="#64748b">plain-language search, US-07/08</text>
  <text x="736" y="577" font-size="12" fill="#64748b">falls back to keyword search</text>

  <!-- internal backend arrows -->
  <line x1="865" y1="340" x2="865" y2="352" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="418" x2="790" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Database -->
  <path d="M1090,262 a120,26 0 0,0 240,0 v236 a120,26 0 0,1 -240,0 z" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <ellipse cx="1210" cy="262" rx="120" ry="26" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1210" y="322" font-size="17" font-weight="700" fill="#7c2d12" text-anchor="middle">Database container</text>
  <text x="1210" y="344" font-size="13" fill="#9a3412" text-anchor="middle">PostgreSQL 16 + PostGIS</text>
  <text x="1210" y="364" font-size="13" fill="#9a3412" text-anchor="middle">port 5432</text>
  <rect x="1120" y="384" width="180" height="40" rx="6" fill="#ffffff" stroke="#fb923c"/>
  <text x="1210" y="409" font-size="13.5" fill="#334155" text-anchor="middle">categories</text>
  <rect x="1120" y="432" width="180" height="40" rx="6" fill="#ffffff" stroke="#fb923c"/>
  <text x="1210" y="457" font-size="13.5" fill="#334155" text-anchor="middle">services (50 listings)</text>
  <text x="1210" y="498" font-size="12" fill="#9a3412" text-anchor="middle">schema via Alembic migrations</text>

  <!-- Main arrows -->
  <line x1="240" y1="385" x2="296" y2="385" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="268" y="377" font-size="12.5" fill="#334155" text-anchor="middle">pages</text>
  <path d="M190,330 C190,200 220,130 296,130" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowGrey)"/>
  <text x="140" y="214" font-size="12.5" fill="#475569">map tiles</text>

  <path d="M600,539 H660 V301 H716" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="623" y="400" width="74" height="40" rx="5" fill="#ffffff"/>
  <text x="660" y="416" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">REST /api</text>
  <text x="660" y="433" font-size="12" fill="#475569" text-anchor="middle">JSON</text>

  <line x1="1010" y1="387" x2="1086" y2="387" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="1048" y="378" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">SQL</text>

  <!-- Seed and geocode -->
  <rect x="1060" y="650" width="300" height="74" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1076" y="676" font-size="15" font-weight="700" fill="#4c1d95">Seed script · seed.py</text>
  <text x="1076" y="698" font-size="13" fill="#334155">loads services.csv · no duplicates</text>
  <text x="1076" y="716" font-size="12" fill="#64748b">python -m seed.seed</text>
  <line x1="1210" y1="650" x2="1210" y2="528" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="700" y="650" width="300" height="74" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="716" y="676" font-size="15" font-weight="700" fill="#5b21b6">geocode.py (one-off)</text>
  <text x="716" y="698" font-size="13" fill="#334155">fills missing coordinates</text>
  <text x="716" y="716" font-size="12" fill="#64748b">once per address, saved in the CSV</text>
  <line x1="1000" y1="687" x2="1056" y2="687" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowGrey)"/>

  <rect x="300" y="650" width="320" height="74" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="678" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Nominatim geocoding</text>
  <text x="460" y="700" font-size="12.5" fill="#64748b" text-anchor="middle">external · OpenStreetMap address lookup</text>
  <line x1="700" y1="700" x2="624" y2="700" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowGrey)"/>

  <!-- CI -->
  <rect x="40" y="650" width="220" height="74" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="676" font-size="15" font-weight="700" fill="#0f172a">GitHub Actions CI</text>
  <text x="56" y="698" font-size="13" fill="#334155">pytest · Vitest · build</text>
  <text x="56" y="716" font-size="12" fill="#64748b">on every pull request</text>

  <!-- Legend -->
  <line x1="40" y1="772" x2="80" y2="772" stroke="#334155" stroke-width="2.2"/>
  <text x="90" y="777" font-size="13" fill="#334155">built and running</text>
  <line x1="240" y1="772" x2="280" y2="772" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="290" y="777" font-size="13" fill="#334155">planned, or one-off tool</text>
  <rect x="490" y="762" width="18" height="18" rx="3" fill="#eff6ff" stroke="#2563eb"/>
  <text x="516" y="777" font-size="13" fill="#334155">frontend</text>
  <rect x="600" y="762" width="18" height="18" rx="3" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="626" y="777" font-size="13" fill="#334155">backend</text>
  <rect x="706" y="762" width="18" height="18" rx="3" fill="#fff7ed" stroke="#ea580c"/>
  <text x="732" y="777" font-size="13" fill="#334155">database</text>
  <rect x="818" y="762" width="18" height="18" rx="3" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="844" y="777" font-size="13" fill="#334155">data loading</text>
</svg>
